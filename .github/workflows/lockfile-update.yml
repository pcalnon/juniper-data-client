---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperDataClient
# Application:   juniper_data_client
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.1.0
#
# Date Created:  2026-05-02
# Last Modified: 2026-07-28
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Aligns juniper-data-client with the rest of the Juniper fleet's
#    Dependabot-push lockfile-management pattern. Triggers on push to a
#    `dependabot/pip/**` branch and regenerates `requirements.lock` (when
#    one exists in this repo) so transitive pins stay in sync with
#    pyproject.toml.
#
#    juniper-data-client is a CLIENT LIBRARY: it currently does NOT ship a
#    requirements.lock. Dependencies live as version ranges in
#    pyproject.toml because consumers pick concrete pins via their own
#    lockfiles. This workflow therefore exists primarily for fleet
#    structural consistency — the regenerate step is guarded on
#    `requirements.lock` actually being present in the repo, so the
#    workflow short-circuits cleanly when there's nothing to lock.
#
#    If the project later decides to ship a requirements.lock for CI
#    reproducibility, drop a seed lockfile into the repo root and this
#    workflow will start regenerating it on every Dependabot pip PR
#    automatically — no edits to this file required.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the push re-
#    triggers CI on the Dependabot branch. See
#    juniper-ml/notes/JUNIPER_2026-05-02_JUNIPER-ECOSYSTEM_V17-V18-CROSS-REPO-DISPATCH-TOKEN-SETUP.md
#    for the secret-provisioning walkthrough.
#####################################################################################################################################################################################################
#
#    Dependabot caveat (2026-07-28): Dependabot-triggered runs use the
#    Dependabot secret store, so the repo-scoped CROSS_REPO_DISPATCH_TOKEN is
#    EMPTY there and the checkout hard-fails on every dependabot/pip/** push
#    (runs 30269229770 / 29860651075 / 29745272774). The token-availability
#    gate below turns that arm into a loud green no-op until the owner
#    registers the same PAT under Settings -> Secrets -> Dependabot. Mirrors
#    juniper-canopy #476 / juniper-cascor #428 / juniper-data #246.

name: Update Lockfile (Dependabot)

on:
  push:
    branches:
      - dependabot/pip/**

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Gate on CROSS_REPO_DISPATCH_TOKEN availability
        id: gate
        env:
          # Secrets are not readable in job/step `if:` expressions, so surface
          # presence (never the value) through env for the shell to branch on.
          HAVE_PAT: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
        run: |
          if [[ "${HAVE_PAT}" == "true" ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "::notice::CROSS_REPO_DISPATCH_TOKEN is not available to Dependabot-triggered runs (Dependabot secret store). Skipping auto-regen; the Lockfile Freshness CI gate still enforces staleness. Register the PAT under Settings -> Secrets -> Dependabot to re-enable."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::CROSS_REPO_DISPATCH_TOKEN is missing for a non-Dependabot run — secret misconfiguration."
            exit 1
          fi

      - name: Checkout Code
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.proceed == 'true'
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock (if present)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Data Client - Regenerate Lockfile            ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          if [ ! -f requirements.lock ]; then
            echo "::notice::No requirements.lock in this repo — skipping regeneration."
            echo "(juniper-data-client ships dependency ranges in pyproject.toml only;"
            echo " this workflow is a structural alignment with the rest of the fleet."
            echo " If a lockfile is added later, this step will start regenerating it"
            echo " automatically.)"
            exit 0
          fi

          # --upgrade is required because uv pip compile reads the existing -o
          # file as pins by default and won't bump transitive deps without it.
          uv pip compile pyproject.toml \
            --upgrade \
            -o requirements.lock

      # The regen commit is created through the GitHub API rather than by a local
      # `git commit` + `git push`, because GitHub SIGNS API-created commits and this repo
      # enforces required_signatures on the default branch (juniper-ml#1099).
      #
      # The old plain push did NOT fail: the ruleset is ~DEFAULT_BRANCH-scoped, so a push to
      # dependabot/pip/** succeeded and left an UNSIGNED commit in the branch's history. That
      # is harmless under a squash merge -- GitHub authors (and signs) the squash commit
      # itself -- but this repo also allows merge commits and rebase merges, and both of those
      # replay the original commit onto main, where required_signatures rejects it. The defect
      # has never fired only because every run so far found the lockfile already current
      # (run 34126070406, 2026-09-07, took the "no commit needed" branch).
      #
      # CROSS_REPO_DISPATCH_TOKEN stays the identity so the resulting commit still re-triggers
      # CI (GITHUB_TOKEN would not). Mirrors juniper-cascor / juniper-data / juniper-canopy,
      # and juniper-cascor-worker#180.
      - name: Commit updated lockfile (GitHub-signed, via API)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # This repo may legitimately have no lockfile yet; the regen step above says so and
          # exits 0, so guard here too rather than failing on a missing file.
          if [ ! -f requirements.lock ]; then
            echo "::notice::No requirements.lock to commit — skipping."
            exit 0
          fi

          if git diff --quiet -- requirements.lock; then
            echo "::notice::Lockfile already up to date — no commit needed"
            exit 0
          fi

          # expectedHeadOid makes this a compare-and-swap: if anything landed on the branch
          # since checkout, the mutation fails loudly rather than clobbering it (the old
          # `git push` had the same protection).
          HEAD_OID=$(git rev-parse HEAD)

          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg oid "${HEAD_OID}" \
            --arg contents "$(base64 -w0 requirements.lock)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "[dependabot skip] Update requirements.lock"},
                expectedHeadOid: $oid,
                fileChanges: {additions: [{path: "requirements.lock", contents: $contents}]}
              }}}' > /tmp/lockfile-commit.json

          gh api graphql --input /tmp/lockfile-commit.json > /tmp/lockfile-commit-result.json

          if jq -e '.errors' /tmp/lockfile-commit-result.json > /dev/null; then
            echo "::error::createCommitOnBranch failed — lockfile NOT committed:"
            jq '.errors' /tmp/lockfile-commit-result.json
            exit 1
          fi

          jq -r '"Signed lockfile commit: " + .data.createCommitOnBranch.commit.url' \
            /tmp/lockfile-commit-result.json
